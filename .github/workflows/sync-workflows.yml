name: Sync Workflows to All Repos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-help-wanted.yml'
      - '.github/workflows/assignment-helper.yml'
      - '.github/workflows/feedback.yml'
      - '.github/workflows/greetings.yml'
      - '.github/workflows/label-helper.yml'
      - '.github/workflows/pr-verifier.yml'
      - '.github/workflows/pr-verify-title.yml'
      - '.github/workflows/scorecard.yml'
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all workflows to all repos'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  get-repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.get-repos.outputs.repos }}
    steps:
      - name: Get list of repos
        id: get-repos
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
        run: |
          # Get all repos in org, excluding .github, infra, and archived repos
          repos=$(gh repo list kubestellar --limit 100 --json name,isArchived --jq '[.[] | select(.isArchived == false) | .name | select(. != ".github" and . != "infra")]')
          echo "repos=$repos" >> $GITHUB_OUTPUT
          echo "Found repos: $repos"

  sync:
    needs: get-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.get-repos.outputs.repos) }}
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: kubestellar/${{ matrix.repo }}
          token: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          path: target

      - name: Sync workflows
        id: sync
        run: |
          # Create workflows directory if it doesn't exist
          mkdir -p target/.github/workflows

          # List of workflows to sync
          WORKFLOWS="add-help-wanted.yml assignment-helper.yml feedback.yml greetings.yml label-helper.yml pr-verifier.yml pr-verify-title.yml scorecard.yml"

          changed=false
          for wf in $WORKFLOWS; do
            src="source/.github/workflows/$wf"
            dst="target/.github/workflows/$wf"

            if [[ -f "$src" ]]; then
              # Check if file is different or doesn't exist
              if [[ ! -f "$dst" ]] || ! diff -q "$src" "$dst" > /dev/null 2>&1; then
                cp "$src" "$dst"
                changed=true
                echo "Updated: $wf"
              fi
            fi
          done

          echo "changed=$changed" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          path: target
          branch: sync/workflows-from-org
          delete-branch: true
          title: "🌱 Sync workflows from org defaults"
          body: |
            This PR syncs the caller workflows from `kubestellar/.github`.

            These workflows call reusable workflows from `kubestellar/infra`:
            - `add-help-wanted.yml`
            - `assignment-helper.yml`
            - `feedback.yml`
            - `greetings.yml`
            - `label-helper.yml`
            - `pr-verifier.yml`
            - `pr-verify-title.yml`
            - `scorecard.yml`

            Auto-generated by workflow sync
          commit-message: "🌱 Sync workflows from kubestellar/.github"
          committer: GitHub Actions <noreply@github.com>
          author: GitHub Actions <noreply@github.com>
